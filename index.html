   {id:'b',type:'num',prompt:'P(<b>next month’s</b> overhead exceeds ₹1,06,000)',ans:rtail(bB,34),pct:true,mistakes:[{v:rtail(bA,34),msg:'Next month is one outcome. Use SE(pred).'}],hints:['Same as a, with SE(pred).']},
   {id:'c',type:'num',prompt:'The <b>maximum average</b> overhead at 1,600 hours, 95% one-sided',ans:PB.yh+t34o*PB.seM,alts:[PB.yh+t34*PB.seM],mistakes:[{v:PB.yh+t34o*PB.seP,msg:'An average uses SE(mean).'}],hints:['Ŷ + T.INV(0.95, 34) × SE(mean)']},
   {id:'d',type:'num',prompt:'How many machine hours give an <b>average</b> overhead of ₹1,00,000?',ans:(100000-48621.35)/34.70224,hints:['X = (100000 − b₀) / b₁']},
   {id:'e',type:'mcq',prompt:'Immigrant wages: each row is one immigrant <i>population</i>. "What’s the chance that a population with 50% English speakers earns more than $12 a week on average?" Which SE?',options:[{t:'SE(pred): one population is one observation, even though its wage is an average.',ok:true},{t:'SE(mean): the question says "on average".',msg:'"On average" describes how each population’s wage is measured. The question is still about one population, which is one row.'}]}
  ]}},
/* ---------- D1 ---------- */
{id:'D1',part:'D',title:'Reading residual plots',viz:'resid',
 rule:'Curve → linearity fails (transform). Funnel → non-constant variance (SEs unreliable). Waves in time → autocorrelation. Bent Q-Q → non-normal errors.',
 idea:`<p>Every t-test, F-test and interval you’ve computed assumes four things about the residuals. The residual plot is how you check them, and papers often ask you to <i>"comment on the plots"</i>.</p>
 <ul><li><b>Linearity</b> (the mean pattern): residuals scatter around 0 with no curve. A U or an arch means the straight line is the wrong form. Fix it by transforming X, Y or both.</li>
 <li><b>Constant variance</b>, or homoscedasticity (the spread): the vertical spread stays the same across X. A <b>funnel</b> is heteroscedasticity. The coefficients are still fine, but the SEs, t, p and intervals become unreliable.</li>
 <li><b>Independence</b> (order): in time-ordered data, today’s error shouldn’t predict tomorrow’s. Waves or runs mean autocorrelation (lesson D3 covers Durbin–Watson).</li>
 <li><b>Normality</b> (shape): the Q-Q plot hugs the line. Small wobbles are fine. Strong skew, heavy tails or outliers are not.</li></ul>
 <p>A high R² and tiny p-values don’t prove the model is right. Pet food had R² = 0.83 and still had the wrong shape.</p>`,
 where:{note:`<p>Below are the five pictures you’ll see in papers, each with its diagnosis.</p>`},
 worked:{prompt:`<p><b>Pet food</b> (104 weeks, sales vs price). The straight-line fit gives R² = 0.828 and p ≈ 0.</p>`,
  steps:[
   {h:'Look at the residuals, not the R²',b:'The residuals against price form a clear curve: positive at both ends, negative in the middle.',fig:'curve'},
   {h:'Diagnose',b:'The mean of the residuals changes with X, so the linearity assumption fails. The straight line is the wrong functional form.'},
   {h:'Fix',b:'Take logs of both variables: ln(Sales) on ln(Price). R² rises to 0.955 and the residuals become a patternless band.',calc:'ln(Sales) = 11.05 − 2.442 × ln(Price)',write:'The residual plot shows a curved pattern, so the linear form is misspecified. A log-log model removes the pattern.'}
  ]},
 guided:{intro:`<p>Diagnose each residual plot.</p>`,
  items:[
   {id:'a',type:'mcq',fig:'funnel',prompt:'Residuals vs X',options:[{t:'Heteroscedasticity: spread grows with X',ok:true},{t:'Non-linearity',msg:'The centre stays at 0. It’s the spread that changes.'},{t:'No problem',msg:'Look at how the vertical spread widens to the right.'}]},
   {id:'b',type:'mcq',fig:'wave',prompt:'Residuals in time order (weekly sales)',options:[{t:'Autocorrelation: errors follow each other in runs',ok:true},{t:'Heteroscedasticity',msg:'The spread is steady. The pattern is that neighbouring points move together.'},{t:'Normality fails',msg:'This is a time-order plot, so check independence first.'}]},
   {id:'c',type:'mcq',fig:'random',prompt:'Residuals vs fitted values',options:[{t:'No visible violation',ok:true},{t:'Non-linearity',msg:'There’s no curve, just even noise around 0.'},{t:'Heteroscedasticity',msg:'The spread looks constant.'}]},
   {id:'d',type:'mcq',fig:'qq',prompt:'Normal Q-Q plot of residuals',options:[{t:'Residuals are skewed: normality is doubtful',ok:true},{t:'Residuals are normal',msg:'The points bend away from the line at the upper end.'},{t:'Autocorrelation',msg:'A Q-Q plot shows shape, not order.'}]},
   {id:'e',type:'mcq',prompt:'With heteroscedasticity, what goes wrong?',options:[{t:'Standard errors, so t-tests, p-values and intervals become unreliable',ok:true},{t:'The coefficients become biased',msg:'OLS coefficients stay unbiased. It’s the inference that breaks.'},{t:'R² can no longer be computed',msg:'R² still computes. The problem is the standard errors.'}]}
  ]}},
/* ---------- D2 ---------- */
{id:'D2',part:'D',title:'Log models and how to read them',
 rule:'log-log: 1% ΔX → β₁% ΔY (elasticity). log-lin (ln Y on X): +1 unit X → ≈100·β₁% ΔY. lin-log (Y on ln X): +1% X → 0.01·β₁ units ΔY.',
 idea:`<p>When the residuals curve, transform the variables until the relationship looks straight. It’s still <i>linear</i> regression, because the model is linear in the β's.</p>
 <div class="tblwrap"><table class="plain"><tr><th>Model</th><th>Equation</th><th>Read β₁ as</th></tr>
 <tr><td>log-log</td><td class="m">ln Y = β₀ + β₁ ln X</td><td>1% more X → β₁ % change in Y (an <b>elasticity</b>)</td></tr>
 <tr><td>log-lin</td><td class="m">ln Y = β₀ + β₁ X</td><td>1 more unit of X → about 100·β₁ % change in Y</td></tr>
 <tr><td>lin-log</td><td class="m">Y = β₀ + β₁ ln X</td><td>1% more X → 0.01·β₁ units change in Y</td></tr></table></div>
 <p style="margin-top:12px">To predict, plug in the log: for lin-log, Ŷ = β₀ + β₁·LN(X). Doubling X adds β₁·LN(2) to Y.</p>
 <p><b>Choosing the transformation (Tukey–Mosteller bulge rule):</b> look at which way the curve bulges, then move X and/or Y "up the ladder" (squares) or "down the ladder" (square roots, logs) towards the bulge.</p>`,
 where:{exhibits:[{title:'Pet food, log-log',cols:['','Coefficients','Standard Error','t Stat'],rows:[['Intercept','11.05056','0.00748','1477.35'],['Ln(Price)','−2.44205','0.052759','−46.2865']]},{title:'Word recall, lin-log (13 people)',cols:['','Coefficients'],rows:[['Intercept','0.8464'],['ln(Time in seconds)','−0.07923']]}],note:`<p>The two transformed models from Sessions 3 and 8.</p>`},
 worked:{prompt:`<p>Read both models.</p>`,
  steps:[
   {h:'Pet food is log-log, so it’s an elasticity',b:'',calc:'β₁ = −2.442: a 1% price rise → about a 2.44% fall in sales',write:'A 1% increase in price is associated with a 2.44% decrease in sales volume.'},
   {h:'Word recall is lin-log',b:'A 1% longer wait changes the recall proportion by 0.01 × (−0.07923).',calc:'1% more time → −0.000792 recall proportion'},
   {h:'Predict with lin-log',b:'Recall after 60 seconds:',calc:`0.8464 − 0.07923 × LN(60) = ${(0.8464-0.07923*Math.log(60)).toFixed(4)}`,xl:['=0.8464-0.07923*LN(60)']},
   {h:'Doubling the time',b:'Going from 60 to 120 seconds changes ln(Time) by ln 2, whatever the starting point.',calc:`−0.07923 × LN(2) = ${(-0.07923*Math.log(2)).toFixed(4)}`,xl:['=-0.07923*LN(2)']}
  ]},
 guided:{intro:`<p>Use the two models shown in "Where it lives".</p>`,
  items:[
   {id:'a',type:'num',prompt:'Predicted recall proportion after 100 seconds',ans:0.8464-0.07923*Math.log(100),mistakes:[{v:0.8464-0.07923*Math.log10(100),msg:'Use the natural log, LN(), not base-10 LOG().'},{v:0.8464-0.07923*100,msg:'Plug in ln(100), not 100.'}],hints:['0.8464 − 0.07923 × LN(100)']},
   {id:'b',type:'num',prompt:'Change in recall when the wait goes from 300 to 600 seconds',ans:-0.07923*Math.log(2),mistakes:[{v:-0.07923*300,msg:'In a lin-log model what matters is the change in ln(Time): ln(600) − ln(300) = ln 2.'}],hints:['−0.07923 × (LN(600) − LN(300))']},
   {id:'c',type:'num',prompt:'Pet food: by the elasticity, approximately what % change in sales follows a 10% price rise? (Enter as a percent, e.g. −5)',ans:-24.4205,mistakes:[{v:24.4205,msg:'The elasticity is negative, so a price rise lowers sales.'},{v:-2.44205,msg:'That’s for a 1% rise. Scale it to 10%.'}],hints:['%ΔY ≈ β₁ × %ΔX = −2.44205 × 10']},
   {id:'d',type:'mcq',prompt:'A model gives ln(Salary) = 10.2 + 0.05 × YearsExp. How do you read 0.05?',options:[{t:'Each extra year is associated with about 5% higher salary',ok:true},{t:'Each extra year adds ₹0.05',msg:'Y is in logs, so the change is in percent, not rupees.'},{t:'A 1% rise in experience gives 0.05% more salary',msg:'That would be log-log. Here X is not logged.'}]}
  ]}},
/* ---------- D3 ---------- */
{id:'D3',part:'D',title:'Outliers, autocorrelation and the zero intercept',
 rule:'Leverage Hᵢᵢ > 2(k+1)/n (3(k+1)/n: high). Cook’s D > 1 (or > 4/(n−k−1)). Mahalanobis > 10. DW d ≈ 2(1 − ρ): near 2 OK, low = +autocorrelation. No intercept → residuals don’t sum to 0, R² not comparable.',
 idea:`<p><b>Three kinds of unusual point:</b></p>
 <ul><li><b>Outlier:</b> a large residual. Y is unusual given X.</li><li><b>Leverage point:</b> an extreme X value. Measured by Hᵢᵢ, the diagonal of the hat matrix H = X(XᵀX)⁻¹Xᵀ.</li><li><b>Influential point:</b> an outlier with leverage. Removing it noticeably changes the coefficients.</li></ul>
 <div class="tblwrap"><table class="plain"><tr><th>Measure</th><th>Flag when</th></tr><tr><td>Leverage Hᵢᵢ</td><td class="m">&gt; 2(k+1)/n (highly: &gt; 3(k+1)/n)</td></tr><tr><td>Cook’s distance</td><td class="m">&gt; 1, or &gt; 4/(n − k − 1)</td></tr><tr><td>Mahalanobis distance</td><td class="m">&gt; 10 (rule of thumb) or &gt; χ²crit(k)</td></tr><tr><td>|SDFFIT|</td><td class="m">&gt; 2√((k+1)/n)</td></tr><tr><td>|SDFBETA|</td><td class="m">&gt; 2/√n</td></tr></table></div>
 <p style="margin-top:12px"><b>Autocorrelation (Durbin–Watson):</b> d = Σ(eᵢ − eᵢ₋₁)² / Σeᵢ² lies between 0 and 4, and d ≈ 2(1 − ρ). Near 2 means no autocorrelation. Below d_L means positive autocorrelation. Above 4 − d_L means negative. Between d_L and d_U the test is inconclusive. SPSS prints DW in the Model Summary.</p>
 <p><b>Forcing the intercept to 0:</b> the residuals no longer sum to zero, and Excel computes R² against ΣY² instead of Σ(Y − Ȳ)². That inflates R² (house prices went from 0.60 to 0.94), so don’t compare it with a normal R².</p>`,
 where:{exhibits:[{title:'House prices: with and without an intercept (n = 1,047)',cols:['Model','R Square','Living Area slope'],rows:[['With intercept','0.6028','81.88'],['Intercept forced to 0','0.9413 (not comparable)','89.68']]}]},
 worked:{prompt:`<p><b>Gender discrimination model</b> with Gender, YearsExp and Gender×YearsExp: n = 200, k = 3.</p>`,
  steps:[
   {h:'Leverage cut-offs',b:'',calc:`2(k+1)/n = 2 × 4 / 200 = 0.04     3(k+1)/n = 0.06`,xl:['=2*(3+1)/200']},
   {h:'Cook’s distance cut-off',b:'',calc:`4/(n − k − 1) = 4 / 196 = ${(4/196).toFixed(4)}   (or the stricter D > 1)`},
   {h:'A Durbin–Watson reading',b:'Suppose time-ordered sales give d = 0.62.',calc:'ρ ≈ 1 − d/2 = 0.69  → strong positive autocorrelation',write:'d is far below 2, so successive errors are positively correlated and the OLS standard errors are unreliable.'}
  ]},
 guided:{intro:`<p><b>Bendrix multiple regression:</b> n = 36, k = 2.</p>`,
  items:[
   {id:'a',type:'num',prompt:'Leverage cut-off 2(k+1)/n',ans:2*3/36,mistakes:[{v:2*2/36,msg:'Use k + 1 = 3, which counts the intercept.'}]},
   {id:'b',type:'num',prompt:'Cook’s distance cut-off 4/(n − k − 1)',ans:4/33},
   {id:'c',type:'num',prompt:'Residuals have first-order correlation ρ = 0.6. Approximate Durbin–Watson d',ans:0.8,abs:0.005,mistakes:[{v:1.2,abs:0.005,msg:'d ≈ 2(1 − ρ) = 2 × 0.4.'}]},
   {id:'d',type:'mcq',prompt:'An observation has a huge residual but an ordinary X value. It is…',options:[{t:'An outlier, but not a leverage point',ok:true},{t:'A leverage point',msg:'Leverage is about extreme X values.'},{t:'Certainly influential',msg:'Influence needs leverage too. Check Cook’s D.'}]},
   {id:'e',type:'mcq',prompt:'Dropping the intercept raised R² from 0.60 to 0.94. Better model?',options:[{t:'No. Without an intercept R² is computed differently and can’t be compared',ok:true},{t:'Yes, higher R² means better fit',msg:'Excel switches SST to ΣY² when the intercept is forced to 0, which inflates R².'}]}
  ]}},
/* ---------- E1 ---------- */
{id:'E1',part:'E',title:'Holding others fixed, and omitted variable bias',viz:'ovb',
 rule:'MLR slope = effect holding the other X’s fixed. Short slope α₁ = β₁ + β₂·δ₁ with δ₁ = Cov(X₁,X₂)/Var(X₁). Bias needs X₂ to matter AND to correlate with X₁. Sign = sign(β₂)·sign(δ₁).',
 idea:`<p>In multiple regression, <b>bⱼ is the change in expected Y for one more unit of Xⱼ, holding the other predictors fixed.</b> Coefficients are <i>conditional</i>, so they change when you add or drop variables.</p>
 <p>Leave out a relevant variable X₂ and the X₁ coefficient soaks up part of X₂'s effect. That’s <b>omitted variable bias</b>:</p>
 <p class="formula">α₁ (short model) = β₁ (full model) + β₂ × δ₁<br>δ₁ = Cov(X₁, X₂)/Var(X₁), the slope of X₂ regressed on X₁</p>
 <p>Bias needs <b>both</b> conditions: X₂ affects Y (β₂ ≠ 0) <b>and</b> X₂ is correlated with X₁ (δ₁ ≠ 0). If either is zero, there’s no bias.</p>
 <p>The direction comes from the signs: <b>sign(bias) = sign(β₂) × sign(δ₁)</b>. Exams often give only the signs of correlations and ask which way a coefficient moves.</p>
 <p>"Controlling for X₂" literally means removing X₂'s linear effect from both Y and X₁, then fitting what’s left. That’s the Frisch–Waugh–Lovell result from Session 4.</p>`,
 where:{model:'bm',cells:{b1:'hl',b2:'s1'},formula:`34.70 (simple) = <span class="chl">43.54</span> + <span class="c1">883.62</span> × (−0.01)`,note:`<p>The full model’s MachHrs coefficient (yellow) and ProdRuns coefficient (blue). The simple regression of overhead on MachHrs alone gave 34.70. Flip the signs below to see how the bias direction follows.</p>`},
 worked:{model:'bm',prompt:`<p><b>Bendrix.</b> Explain why the MachHrs slope is 34.70 alone but 43.54 with ProdRuns included.</p>`,
  steps:[
   {h:'The three regressions',b:'Full: β₁ = 43.5364, β₂ = 883.6179. Short: α₁ = 34.70224. ProdRuns on MachHrs: δ₁ = Cov/Var = −384.077 / 38,416.49.',calc:`δ₁ = ${(-384.077/38416.49).toFixed(6)}`,xl:['=-384.077/38416.49']},
   {h:'Bias',b:'',calc:`β₂ × δ₁ = 883.6179 × (${(-384.077/38416.49).toFixed(6)}) = ${(883.6179*-384.077/38416.49).toFixed(3)}`,xl:['=883.6179*(-384.077/38416.49)']},
   {h:'Check',b:'',calc:`43.5364 + (${(883.6179*-384.077/38416.49).toFixed(3)}) = ${(43.5364+883.6179*-384.077/38416.49).toFixed(3)} ≈ 34.702 ✓`},
   {h:'Interpret',b:'ProdRuns raises overhead and runs opposite to MachHrs, so leaving it out <b>understates</b> the MachHrs effect.',write:'Omitting ProdRuns biases the MachHrs coefficient downward by β₂δ₁ ≈ −8.83, because ProdRuns affects overhead and is negatively correlated with MachHrs.'}
  ]},
 guided:{model:'bm',intro:`<p>Same Bendrix data, other direction. Regressing MachHrs on ProdRuns gives a slope of <b>−5.24957</b>.</p>`,
  items:[
   {id:'a',type:'num',prompt:'Predict the slope of the <b>simple</b> regression of Overhead on ProdRuns',ans:883.6179+43.5364*-5.24957,mistakes:[{v:883.6179-43.5364*-5.24957,msg:'Add β₂ × δ₁ = 43.5364 × (−5.24957), which is negative.'}],hints:['α = β_ProdRuns + β_MachHrs × δ','883.6179 + 43.5364 × (−5.24957)']},
   {id:'b',type:'mcq',prompt:'Box office: collections regressed on YouTube likes and Budget. Budget raises collections and is <b>positively</b> correlated with likes (r = 0.609). Drop Budget. What happens to the likes coefficient?',options:[{t:'It rises: positive bias',ok:true},{t:'It falls: negative bias',msg:'β₂ > 0 and δ₁ > 0, so the bias is positive.'},{t:'No change',msg:'Budget matters and correlates with likes, so both conditions for bias hold.'}]},
   {id:'c',type:'mcq',prompt:'You omit a variable that strongly affects Y but is <b>uncorrelated</b> with X₁. The X₁ coefficient is…',options:[{t:'Unbiased, though Sₑ is larger and R² lower',ok:true},{t:'Biased upward',msg:'With δ₁ = 0 the bias β₂δ₁ is 0.'},{t:'Biased downward',msg:'With δ₁ = 0 the bias β₂δ₁ is 0.'}]},
   {id:'d',type:'mcq',prompt:'"MLR coefficient of MachHrs = 43.54" means…',options:[{t:'One more machine hour adds ₹43.54 to expected overhead, holding ProdRuns fixed',ok:true},{t:'One more machine hour adds ₹43.54 regardless of what else changes',msg:'MLR coefficients are conditional: other predictors are held fixed.'},{t:'MachHrs causes 43.54% of overhead',msg:'It’s a per-unit change, not a share.'}]}
  ]}},
/* ---------- E2 ---------- */
{id:'E2',part:'E',title:'Multicollinearity and VIF',
 rule:'VIFⱼ = 1/(1 − Rⱼ²) = 1/Tolerance. With two predictors, Rⱼ² = r². SE inflates by √VIF. VIF > 4: look into it. VIF > 10: serious.',
 idea:`<p><b>Multicollinearity</b> is when a predictor is strongly explained by the other predictors. The model can’t tell their effects apart, so:</p>
 <ul><li>coefficients become unstable and may flip sign</li><li>their SEs blow up, so t falls and p rises and relevant variables look insignificant</li><li>R² barely changes, and predictions inside the data range are still fine</li></ul>
 <p class="formula">Rⱼ² = R² from regressing Xⱼ on the other X’s<br>Tolerance = 1 − Rⱼ² &nbsp;&nbsp; VIFⱼ = 1/Tolerance<br>SE(actual) = SE(no collinearity) × √VIF</p>
 <p>With just two predictors, Rⱼ² is simply their squared correlation. Thresholds: VIF &gt; 4 calls for investigation, and VIF &gt; 10 is severe (the formula sheet uses &gt; 10).</p>
 <p>Remedies: drop one of the overlapping variables, combine them, or collect data with more independent variation. Note that adding a correlated predictor <b>never lowers R²</b>.</p>`,
 where:{exhibits:[{title:'Height on both feet (n = 105)',cols:['','Coefficient','Std. Error','p'],rows:[['Right foot','6.8229','3.4285','0.049'],['Left foot','−3.6448','3.4411','0.292']]},{title:'Height on Right foot only',cols:['','Coefficient','Std. Error',''],rows:[['Right foot','3.1949','0.1497','']]}],note:`<p>Right and left foot correlate at 0.999. The fit hardly changes (R² 0.816 → 0.818), but the SE jumps more than twentyfold.</p>`},
 worked:{prompt:`<p><b>Height vs feet.</b> Regressing Right on Left gives R² = 0.998096. Quantify the multicollinearity.</p>`,
  steps:[
   {h:'Tolerance',b:'',calc:'1 − 0.998096 = 0.001904'},
   {h:'VIF',b:'',calc:`1 / 0.001904 = ${(1/0.001904).toFixed(1)}`,xl:['=1/(1-0.998096)']},
   {h:'SE inflation',b:'The SE should grow by √VIF. Check against the outputs.',calc:`√525.2 = ${Math.sqrt(1/0.001904).toFixed(2)}   vs   3.4285 / 0.1497 = ${(3.4285/0.1497).toFixed(2)} ✓`,xl:['=SQRT(1/(1-0.998096))'],write:'VIF ≈ 525, far above 10, so the multicollinearity is severe. The standard error of Right foot is inflated about 23-fold, which is why Left foot looks insignificant and has the wrong sign.'}
  ]},
 guided:{intro:`<p>Compute and interpret VIFs.</p>`,
  items:[
   {id:'a',type:'num',prompt:'A model has only two predictors, Test2 and Test3, correlated at r = 0.80. VIF?',ans:1/(1-0.64),mistakes:[{v:1/(1-0.8),msg:'Square the correlation first: Rⱼ² = r².'}],hints:['VIF = 1/(1 − r²)']},
   {id:'b',type:'num',prompt:'SPSS shows Tolerance = 0.198 for fixed acidity. VIF?',ans:1/0.198,hints:['VIF = 1/Tolerance']},
   {id:'c',type:'num',prompt:'A predictor has VIF = 4. By what factor is its SE inflated?',ans:2,abs:0.01,mistakes:[{v:4,abs:0.01,msg:'The SE inflates by √VIF, not VIF.'}]},
   {id:'d',type:'mcq',prompt:'Model 1 has PercentPopE. Model 2 adds literacy rate, correlated 0.99 with PercentPopE. Compare R².',options:[{t:'R² of Model 2 ≥ R² of Model 1',ok:true},{t:'R² of Model 2 < R² of Model 1, because of multicollinearity',msg:'Adding a predictor never lowers R², even a redundant one. It inflates the SEs instead.'},{t:'Can’t tell',msg:'R² never falls when you add a variable.'}]},
   {id:'e',type:'mcq',prompt:'With both feet in the model, Left foot has p = 0.29. Conclusion?',options:[{t:'Left foot isn’t useless: it overlaps with Right foot, and t-tests are conditional',ok:true},{t:'Left foot has no relationship with height',msg:'Alone it has R² = 0.81. It only looks insignificant because Right foot carries the same information.'}]}
  ]}},
/* ---------- E3 ---------- */
{id:'E3',part:'E',title:'Partial and part correlation, and building R²',viz:'decomp',
 rule:'part = (r_Y2 − r_Y1·r_12)/√(1 − r_12²); partial = (r_Y2 − r_Y1·r_12)/√((1 − r_Y1²)(1 − r_12²)). part² = ΔR². partial² = ΔR²/(1 − R²_old).',
 idea:`<p>When X₂ joins a model that already has X₁, how much does it add? Two correlations answer that.</p>
 <ul><li><b>Part (semi-partial) correlation:</b> correlate Y with the part of X₂ that X₁ can’t explain. Its square is X₂'s <b>unique share of all the variation in Y</b>: <b>part² = R²_new − R²_old</b>.</li>
 <li><b>Partial correlation:</b> remove X₁ from <i>both</i> Y and X₂, then correlate what’s left. Its square is X₂'s share of the variation <b>X₁ left unexplained</b>: <b>partial² = ΔR² / (1 − R²_old)</b>.</li></ul>
 <p class="formula">part = (r_Y2 − r_Y1·r_12) / √(1 − r_12²)<br>partial = (r_Y2 − r_Y1·r_12) / √((1 − r_Y1²)(1 − r_12²))<br>R²_new = R²_old + part² = R²_old + partial² × (1 − R²_old)</p>
 <p>Partial is always at least as large as part. SPSS stepwise tables print "Zero-order / Partial / Part" columns. Zero-order is the plain correlation.</p>`,
 where:{model:'bm',cells:{R2:'hl'},note:`<p>Bendrix: correlations Overhead–MachHrs 0.6319, Overhead–ProdRuns 0.5205, MachHrs–ProdRuns −0.2291. Toggle the entry order below: the final R² is the same either way, but the credit each variable gets changes.</p>`},
 worked:{prompt:`<p><b>Bendrix.</b> MachHrs is in. How much does ProdRuns add? (r_Y1 = 0.631885, r_Y2 = 0.520544, r_12 = −0.22909.)</p>`,
  steps:[
   {h:'Common numerator',b:'',calc:`0.520544 − 0.631885 × (−0.22909) = ${(0.520544+0.631885*0.22909).toFixed(5)}`},
   {h:'Part correlation',b:'Divide by √(1 − r_12²).',calc:`${(0.520544+0.631885*0.22909).toFixed(5)} / √(1 − 0.22909²) = ${cor(0.631885,0.520544,-0.22909).part.toFixed(4)}`,xl:['=(0.520544-0.631885*-0.22909)/SQRT(1-0.22909^2)']},
   {h:'Partial correlation',b:'Also divide by √(1 − r_Y1²).',calc:`= ${cor(0.631885,0.520544,-0.22909).partial.toFixed(4)}`,xl:['=(0.520544-0.631885*-0.22909)/SQRT((1-0.631885^2)*(1-0.22909^2))']},
   {h:'Build R²',b:'',calc:`0.399278 + ${cor(0.631885,0.520544,-0.22909).part.toFixed(4)}² = ${(0.399278+cor(0.631885,0.520544,-0.22909).part**2).toFixed(4)} ≈ 0.866425 ✓`,write:'ProdRuns uniquely adds 46.7% to R² after MachHrs (part² = 0.467) and explains 77.8% of the variation that MachHrs left unexplained (partial² = 0.778).'}
  ]},
 guided:{intro:`<p><b>House prices</b> (1,047 houses). Correlations: Price–LivingArea 0.7764, Price–Bathrooms 0.6702, LivingArea–Bathrooms 0.7226. LivingArea is in the model, and Bathrooms is next.</p>`,
  items:[
   {id:'a',type:'num',prompt:'Partial correlation of Bathrooms',ans:HP.partial,mistakes:[{v:HP.part,msg:'That’s the part correlation. Partial also divides by √(1 − r_Y1²).'}],hints:['(0.6702 − 0.7764 × 0.7226) / √((1 − 0.7764²)(1 − 0.7226²))']},
   {id:'b',type:'num',prompt:'Part correlation of Bathrooms',ans:HP.part,mistakes:[{v:HP.partial,msg:'That’s the partial correlation. Part divides only by √(1 − r_12²).'}],hints:['(0.6702 − 0.7764 × 0.7226) / √(1 − 0.7226²)']},
   {id:'c',type:'num',prompt:'R² after adding Bathrooms',ans:0.77639645**2+HP.part**2,pct:true,mistakes:[{v:0.77639645**2+HP.partial**2,msg:'Add part², not partial². Partial² is a share of the leftover variation only.'}],hints:['R²_old = 0.7764²','R²_new = R²_old + part²']},
   {id:'d',type:'num',prompt:'<b>Gender case, stepwise:</b> step 1 (OrgLevelF) has R² = 0.453046. OrgLevelE has partial correlation 0.518. R² after it enters?',ans:0.453046+0.518**2*(1-0.453046),pct:true,mistakes:[{v:0.453046+0.518**2,msg:'Partial² is a share of the <i>unexplained</i> part. Multiply by (1 − 0.453046).'}],hints:['R²_new = R²_old + partial² × (1 − R²_old)']}
  ]}},
/* ---------- E4 ---------- */
{id:'E4',part:'E',title:'Partial F-test and adjusted R²',
 rule:'Partial F = [(R²_full − R²_red)/r] / [(1 − R²_full)/(n − k − 1)], r = number of variables added, k = predictors in the full model. One variable: F = t². Adj R² = 1 − (1 − R²)(n − 1)/(n − k − 1).',
 idea:`<p>A t-test asks about one coefficient. The <b>partial F-test asks whether a <i>group</i> of added variables improves the model</b>, given what’s already in it.</p>
 <p class="formula">F = [(SSE_red − SSE_full)/r] / MSE_full = [(R²_full − R²_red)/r] / [(1 − R²_full)/(n − k − 1)]</p>
 <ul><li>H₀: all r added coefficients = 0. H₁: at least one isn’t.</li><li>df = (r, n − k − 1), where k counts the predictors in the <b>full</b> model.</li><li>p = <code>F.DIST.RT(F, r, n − k − 1)</code>, critical value = <code>F.INV.RT(α, r, n − k − 1)</code>.</li>
 <li>If you add just one variable, partial F = t² of that variable. In stepwise outputs, the F for the first variable equals the model’s overall F.</li></ul>
 <p>Rejecting H₀ means the group is <i>jointly</i> significant. It doesn’t mean each variable in it is.</p>
 <p><b>Adjusted R²</b> = 1 − (1 − R²)(n − 1)/(n − k − 1) charges for each predictor. It can fall when a weak variable is added, even though R² rises.</p>`,
 where:{model:'bm',cells:{R2:'hl',adjR2:'hl',ss_res:'s1',ms_res:'s2'},formula:`F = (SSE_red − <span class="c1">SSE_full</span>)/r ÷ <span class="c2">MSE_full</span>`,note:`<p>The reduced model (MachHrs only) had SSE = 2,505,723,500 and R² = 0.399278.</p>`},
 worked:{model:'bm',prompt:`<p><b>Bendrix.</b> Does ProdRuns add explanatory power once MachHrs is in? n = 36, full k = 2, r = 1.</p>`,
  steps:[
   {h:'Hypotheses',b:'',calc:'H₀: β_ProdRuns = 0    H₁: β_ProdRuns ≠ 0'},
   {h:'R² route',b:'',calc:`F = (0.866425 − 0.399278)/1 ÷ ((1 − 0.866425)/33) = ${((0.866425-0.399278)/((1-0.866425)/33)).toFixed(2)}`,xl:['=(0.866425-0.399278)/1/((1-0.866425)/33)']},
   {h:'Same as t²',b:'One added variable, so F should equal t² of ProdRuns.',calc:`10.74289² = ${(10.74289**2).toFixed(2)} ✓`},
   {h:'Decide',b:'',calc:`F_crit = F.INV.RT(0.05, 1, 33) = ${finvrt(0.05,1,33).toFixed(3)}`,xl:['=F.INV.RT(0.05, 1, 33)'],write:'F = 115.4 > 4.14, so reject H₀. ProdRuns significantly improves the model after controlling for MachHrs.'}
  ]},
 guided:{intro:`<p><b>Gender discrimination</b> (n = 200). Model A has Gender, YearsExp and Gender×YearsExp (R² = 0.644303). Model B adds <b>four</b> education dummies (R² = 0.734922, k = 7).</p>`,
  items:[
   {id:'a',type:'num',prompt:'Partial F for the education block',ans:gEdu,mistakes:[{v:(0.734922-0.644303)/((1-0.734922)/192),msg:'Divide the R² gain by r = 4, the number of variables added.'},{v:((0.734922-0.644303)/4)/((1-0.734922)/196),msg:'Use the full model’s residual df: n − k − 1 = 200 − 7 − 1 = 192.'}],hints:['[(0.734922 − 0.644303)/4] ÷ [(1 − 0.734922)/192]']},
   {id:'b',type:'num',prompt:'Critical F at 5%',ans:finvrt(0.05,4,192),hints:['F.INV.RT(0.05, 4, 192)']},
   {id:'c',type:'mcq',prompt:'Decision',options:[{t:'Reject H₀: education jointly matters, given gender and experience',ok:true},{t:'Fail to reject H₀',msg:'F ≈ 16.4 is far above 2.42.'},{t:'Every education dummy is individually significant',msg:'Joint significance says nothing about each one. Commerce has p = 0.60.'}]},
   {id:'d',type:'num',prompt:'Adjusted R² of Model B',ans:1-(1-0.734922)*199/192,pct:true,hints:['1 − (1 − 0.734922) × 199/192']},
   {id:'e',type:'num',prompt:'Model A vs Gender + YearsExp only (R² = 0.493321): partial F for the interaction term (full k = 3)',ans:(0.644303-0.493321)/((1-0.644303)/196),hints:['(0.644303 − 0.493321)/1 ÷ ((1 − 0.644303)/196)','Check: it should be about 9.12118²']}
  ]}},
/* ---------- E5 ---------- */
{id:'E5',part:'E',title:'Standardized coefficients: which matters more?',
 rule:'β* = b × S_X / S_Y. Compare |β*|, not raw b. In simple regression β* = r.',
 idea:`<p>Raw coefficients can’t be compared across variables, because one machine hour and one production run are different units. "Which variable has the <b>highest impact</b>?" needs <b>standardized coefficients</b>:</p>
 <p class="formula">β*ⱼ = bⱼ × S_Xⱼ / S_Y</p>
 <p>β* is the number of standard deviations Y changes per one-SD change in Xⱼ, holding the others fixed. Compare absolute values. SPSS prints it as "Standardized Coefficients Beta".</p>
 <ul><li>In simple regression, β* equals the correlation r.</li><li>You can run it backwards: b = β* × S_Y / S_X, which recovers a blanked coefficient.</li><li>With strong multicollinearity, β* is not a reliable ranking of importance.</li></ul>`,
 where:{model:'bm',cells:{b1:'s1',b2:'s2'},formula:`β* = b × S_X / S_Y &nbsp; (S_Y = 10,916.81, S_MachHrs = 198.78, S_ProdRuns = 8.675)`},
 worked:{model:'bm',prompt:`<p><b>Bendrix.</b> ProdRuns has the bigger raw coefficient (883.6 vs 43.5). Does it matter more?</p>`,
  steps:[
   {h:'MachHrs',b:'',calc:`43.5364 × 198.7815 / 10916.81 = ${(43.5364*198.7815/10916.81).toFixed(4)}`,xl:['=43.5364*198.7815/10916.81']},
   {h:'ProdRuns',b:'',calc:`883.6179 × 8.674905 / 10916.81 = ${(883.6179*8.674905/10916.81).toFixed(4)}`,xl:['=883.6179*8.674905/10916.81']},
   {h:'Compare',b:'0.793 > 0.702.',write:'MachHrs has the larger standardized coefficient, so it has the somewhat stronger conditional association with overhead, despite its smaller raw coefficient.'}
  ]},
 guided:{intro:`<p><b>Wine quality</b> (S_quality = 0.808). Coefficients: alcohol 0.294 (S = 1.0656), volatile acidity −1.114 (S = 0.1790), sulphates 0.672 (S = 0.1695).</p>`,
  items:[
   {id:'a',type:'num',prompt:'Standardized coefficient of alcohol',ans:0.294*1.0656/0.808,mistakes:[{v:0.294*0.808/1.0656,msg:'Multiply by S_X and divide by S_Y, not the other way round.'}]},
   {id:'b',type:'num',prompt:'Standardized coefficient of volatile acidity',ans:-1.114*0.1790/0.808},
   {id:'c',type:'mcq',prompt:'Which variable has the highest impact on quality?',options:[{t:'Alcohol (|β*| ≈ 0.39)',ok:true},{t:'Volatile acidity: its raw coefficient is the largest',msg:'Raw coefficients depend on units. Compare |β*|: 0.388 > 0.247.'},{t:'Sulphates',msg:'|β*| = 0.141, the smallest of the three.'}]},
   {id:'d',type:'num',prompt:'Backwards: a predictor has β* = 0.792, S_X = 198.78, S_Y = 10,916.81. Raw coefficient b?',ans:0.792*10916.81/198.78,hints:['b = β* × S_Y / S_X']}
  ]}},
/* ---------- F1 ---------- */
{id:'F1',part:'F',title:'Dummy variables and the base category',
 rule:'m categories → m − 1 dummies. Intercept = base. Dummy coefficient = difference from base (others fixed). New base: subtract the new base’s coefficient from every dummy; add it to the intercept.',
 idea:`<p>Categories (quarter, city, gender, degree) enter a regression as 0/1 <b>dummy variables</b>.</p>
 <ul><li><b>m categories need m − 1 dummies.</b> The left-out one is the <b>base</b>. Including all m is the <i>dummy trap</i>: they sum to 1, which gives perfect multicollinearity with the intercept.</li>
 <li><b>Intercept</b> = the base category’s value (when other X’s are 0). Each <b>dummy coefficient</b> = that category minus the base, holding the other predictors fixed.</li>
 <li>A regression on dummies alone reproduces the <b>group means</b> exactly. The intercept is the base mean, and intercept + coefficient is each other group’s mean.</li>
 <li><b>Change the base without re-running:</b> new intercept = old intercept + coefficient of the new base. New coefficient of each other category = its old coefficient − coefficient of the new base. The old base’s coefficient becomes −(new base’s old coefficient).</li>
 <li>A dummy’s t-test compares that category with the <b>base only</b>. To test two non-base categories against each other, you need a model where one of them is the base.</li>
 <li>With an intercept, the fitted equation passes through each group’s mean point. That lets you recover a group’s average X from the outputs.</li></ul>`,
 where:{exhibits:[{title:'Forecasting: Sales on Year and quarter dummies (Q1 is the base), n = 16',cols:['','Coefficients','Std. Error','P-value'],rows:[['Intercept','170.25','4.2948','3.2E-13'],['Q2','−19.75','4.0491','0.0005'],['Q3','−29.25','4.0491','1.7E-05'],['Q4','−15.5','4.0491','0.0028'],['Year','−3.3','1.2804','0.0257']]}],note:`<p>There’s no Q1 row: it’s the base. Each quarter gets its own intercept and they share a slope, so the lines are parallel.</p>`},
 worked:{prompt:`<p><b>Forecasting.</b> Write each quarter’s equation, then move the base to Q4.</p>`,exhibits:[{title:'Coefficients',cols:['Intercept','Q2','Q3','Q4','Year'],rows:[['170.25','−19.75','−29.25','−15.5','−3.3']]}],
  steps:[
   {h:'Per-quarter lines',b:'Add the quarter’s dummy to the intercept.',calc:'Q1: 170.25 − 3.3·Year   Q2: 150.50 − 3.3·Year   Q3: 141.00 − 3.3·Year   Q4: 154.75 − 3.3·Year'},
   {h:'New intercept with Q4 as base',b:'',calc:'170.25 + (−15.5) = 154.75',xl:['=170.25-15.5']},
   {h:'New dummy coefficients',b:'Subtract Q4’s old coefficient (−15.5) from each.',calc:'Q1: 0 − (−15.5) = +15.5   Q2: −19.75 + 15.5 = −4.25   Q3: −29.25 + 15.5 = −13.75',write:'With Q4 as base: Sales = 154.75 − 3.3·Year + 15.5·Q1 − 4.25·Q2 − 13.75·Q3.'},
   {h:'What doesn’t change',b:'The fitted values, R², Sₑ and F are identical. Only the labels move.'}
  ]},
 guided:{intro:`<p><b>Gender discrimination</b> (Gender = 1 for female).<br>Model 1: Salary = 545,158.2 − 101,177 × Gender.<br>Model 2: Salary = 440,769.6 − 96,986.8 × Gender + 11,757.08 × YearsExp.<br>Education model (base: Arts): Intercept 314,754.12, Gender 47,144.93, Commerce 9,029.75 (p = 0.60), Science 71,980.85, Technology 41,040.34, PostGrad 112,641.15 (plus experience terms).</p>`,
  items:[
   {id:'a',type:'num',prompt:'Average female salary in the sample (Model 1)',ans:545158.2-101177,hints:['Intercept + Gender coefficient']},
   {id:'b',type:'num',prompt:'Coefficient of Technology if Science were the base',ans:41040.34-71980.85,mistakes:[{v:71980.85-41040.34,msg:'New coefficient = Technology − Science, which is negative.'}],hints:['41,040.34 − 71,980.85']},
   {id:'c',type:'num',prompt:'Estimated starting salary (0 years) of a woman with a Science degree',ans:314754.12+47144.93+71980.85,hints:['Intercept + Gender + Science']},
   {id:'d',type:'num',prompt:'Using Models 1 and 2, the average years of experience of <b>male</b> employees',ans:(545158.2-440769.6)/11757.08,hints:['Model 2 passes through the male mean point: 545,158.2 = 440,769.6 + 11,757.08 × Exp_male']},
   {id:'e',type:'mcq',prompt:'Is the salary difference between Commerce and Science graduates significant, from this table alone?',options:[{t:'Can’t tell: both t-tests compare against Arts. Re-run with one of them as base.',ok:true},{t:'No, because Commerce has p = 0.60',msg:'That p-value compares Commerce with Arts, not with Science.'},{t:'Yes, because Science is significant',msg:'Science is significant against Arts. That doesn’t settle Commerce vs Science.'}]}
  ]}},
/* ---------- F2 ---------- */
{id:'F2',part:'F',title:'Interactions: when the slope depends on the group',viz:'inter',
 rule:'Y = β₀ + β₁D + β₂X + β₃(D·X). Base group: β₀ + β₂X. Other group: (β₀+β₁) + (β₂+β₃)X. β₃ = slope difference, and its t-test asks whether the slopes differ. Gap at X = β₁ + β₃X. Keep main effects when an interaction stays.',
 idea:`<p>A dummy alone shifts the line up or down, giving parallel lines. To let the <b>slope</b> differ by group, add an <b>interaction</b>: the product of the dummy and the numeric variable.</p>
 <p class="formula">Y = β₀ + β₁·D + β₂·X + β₃·(D·X)<br>D = 0: Y = β₀ + β₂X<br>D = 1: Y = (β₀ + β₁) + (β₂ + β₃)X</p>
 <ul><li><b>β₃</b> is how much steeper (or flatter) the D = 1 group’s slope is. Its t-test is the test of "does the X effect differ by group?"</li>
 <li><b>β₁</b> is now the gap at X = 0 only. The gap at any X is β₁ + β₃·X.</li>
 <li>Keep β₁ and β₂ (the main effects) in the model whenever the interaction is kept, even if they look insignificant.</li>
 <li>With several categories (cities), each category’s slope = base slope + its interaction coefficient.</li></ul>`,
 where:{exhibits:[{title:'Salary on Gender, YearsExp and Gender×YearsExp (n = 200, R² = 0.644)',cols:['','Coefficients','Std. Error','P-value'],rows:[['Intercept','383,210.2','13,938.6','3.5E-69'],['Gender (1 = F)','34,699.71','18,955.74','0.0687'],['YearsExp','18,239.88','1,087.62','9.8E-40'],['Gender×YearsExp','−15,180.7','1,664.34','9.0E-17']]}],note:`<p>Toggle below to compare the parallel-lines model with the interaction model.</p>`},
 worked:{prompt:`<p><b>Gender discrimination.</b> Write the male and female salary lines and interpret them.</p>`,
  steps:[
   {h:'Male (Gender = 0)',b:'',calc:'Salary = 383,210 + 18,240 × YearsExp'},
   {h:'Female (Gender = 1)',b:'Add β₁ to the intercept and β₃ to the slope.',calc:'Salary = (383,210 + 34,700) + (18,240 − 15,181) × YearsExp = 417,910 + 3,059 × YearsExp'},
   {h:'Does experience pay differently?',b:'The interaction p-value is 9.0E-17, so the slopes differ significantly.'},
   {h:'Gap at 10 years',b:'',calc:'β₁ + β₃ × 10 = 34,700 − 151,807 = −117,107',xl:['=34699.71-15180.7*10'],write:'Women start slightly higher but gain only ₹3,059 per year of experience against ₹18,240 for men, so the gap against women widens with tenure.'}
  ]},
 guided:{intro:`<p><b>Education model</b> (base: Arts, male): Salary = 314,754.12 + 47,144.93·Gender + 17,430.62·YearsExp − 12,669.65·Gender·YearsExp + 9,029.75·Commerce + 71,980.85·Science + 41,040.34·Technology + 112,641.15·PostGrad. Interaction p = 4.5E-15.</p>`,
  items:[
   {id:'a',type:'num',prompt:'Yearly salary increment for women',ans:17430.62-12669.65,mistakes:[{v:17430.62,msg:'That’s the men’s slope. Women’s = β₂ + β₃.'}],hints:['17,430.62 + (−12,669.65)']},
   {id:'b',type:'num',prompt:'Predicted salary: woman, PostGrad, 5 years',ans:314754.12+47144.93+112641.15+5*(17430.62-12669.65),hints:['Intercept + Gender + PostGrad + 5 × (17,430.62 − 12,669.65)']},
   {id:'c',type:'num',prompt:'Female − male salary gap at 10 years (same degree)',ans:47144.93-12669.65*10,mistakes:[{v:47144.93,msg:'That’s the gap at 0 years only. Add β₃ × 10.'}],hints:['β₁ + β₃ × 10']},
   {id:'d',type:'mcq',prompt:'Does gender change the salary–experience relationship?',options:[{t:'Yes: the interaction is significant (p ≈ 4.5E-15)',ok:true},{t:'No: Gender’s own coefficient decides that',msg:'The Gender coefficient is about the intercept. The interaction decides the slope.'},{t:'Only if R² rises',msg:'Test the interaction coefficient (or use a partial F).'}]},
   {id:'e',type:'mcq',prompt:'In a model with Gender×YearsExp, Gender alone has p = 0.07. Drop Gender?',options:[{t:'No. Keep main effects while their interaction is in the model',ok:true},{t:'Yes, it’s insignificant at 5%',msg:'Dropping it forces both lines to share an intercept and changes what the interaction means.'}]}
  ]}},
/* ---------- F3 ---------- */
{id:'F3',part:'F',title:'Stepwise, forward and backward selection',
 rule:'Step 1: largest |zero-order r| (R² = r²). Next: largest |partial r| among excluded variables, entered if p < p-in (0.05). Remove if p > p-out (0.10). Forward never removes, backward never re-adds. Excluded ≠ uncorrelated.',
 idea:`<p>Stepwise regression builds a model one variable at a time.</p>
 <ol style="max-width:68ch"><li><b>First variable:</b> the one with the largest <i>absolute zero-order correlation</i> with Y. Its R² = r², and its partial F equals the model F.</li>
 <li><b>Next variable:</b> among the excluded variables, the one with the largest <i>partial correlation</i> (equivalently, the biggest partial F). It enters if its p-value &lt; <b>p-in</b> (JASP/SPSS default 0.05).</li>
 <li><b>Re-check:</b> after each entry, any included variable with p &gt; <b>p-out</b> (default 0.10) is removed.</li>
 <li>Stop when nothing qualifies to enter or leave.</li></ol>
 <div class="tblwrap"><table class="plain"><tr><th>Method</th><th>Adds</th><th>Removes</th><th>Can undo a decision</th></tr><tr><td>Stepwise</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td>Forward</td><td>Yes</td><td>No</td><td>No</td></tr><tr><td>Backward</td><td>No</td><td>Yes</td><td>No</td></tr></table></div>
 <p style="margin-top:12px">The formula sheet’s thresholds are F-in &gt; 3.84 / p-in &lt; 0.05 and F-out &lt; 2.71 / p-out &gt; 0.10.</p>
 <p>An <b>excluded</b> variable is not necessarily uncorrelated with Y. It usually just adds too little once the others are in, often because it overlaps with them.</p>`,
 where:{exhibits:[{title:'Gender case: zero-order correlations with Salary (extract)',cols:['Variable','r'],rows:[['ORG Level F','0.673'],['Exp (Years)','0.617'],['Post Graduate','0.443'],['ORG Level A','−0.428'],['Gender','−0.351'],['ORG Level E','0.320']]},{title:'Excluded variables after step 1 (extract)',cols:['Variable','Beta In','Sig.','Partial'],rows:[['ORG Level E','0.385','0.000','0.518'],['ORG Level A','−0.322','0.000','−0.429'],['Post Graduate','0.292','0.000','0.382'],['Exp (Years)','0.331','0.000','0.355']]}]},
 worked:{prompt:`<p><b>Gender case.</b> Run the first two steps.</p>`,
  steps:[
   {h:'Step 1',b:'The largest |r| with Salary is ORG Level F (0.673).',calc:'R² = 0.673087² = 0.4530',xl:['=0.673087^2']},
   {h:'Step 2',b:'Among the excluded variables, ORG Level E has the largest |partial| (0.518), even though Exp (Years) had the bigger zero-order r. What matters now is what it adds beyond Level F.',calc:'R² = 0.453046 + 0.518² × (1 − 0.453046) = 0.5998'},
   {h:'Check entry',b:'',calc:'Partial F = (0.599123 − 0.453046)/1 ÷ ((1 − 0.599123)/197) = 71.78, p ≈ 5.5E-15 < 0.05 → enters',write:'ORG Level E enters at step 2 because it has the largest partial correlation (0.518) among the excluded variables and its partial F-test is significant.'},
   {h:'Re-check',b:'Re-test ORG Level F given Level E. It stays (p ≈ 0).'}
  ]},
 guided:{intro:`<p><b>Precision Watches.</b> Correlations with JobPerf: Seniority 0.43, Test1 0.58, Test2 0.52, Test3 0.62.</p>`,
  items:[
   {id:'a',type:'mcq',prompt:'Which variable enters first?',options:[{t:'Test3',ok:true},{t:'Test1',msg:'0.58 < 0.62.'},{t:'Seniority',msg:'It has the smallest correlation here.'}]},
   {id:'b',type:'num',prompt:'R² after step 1',ans:0.62**2,pct:true,mistakes:[{v:0.62,msg:'R² = r².'}]},
   {id:'c',type:'mcq',prompt:'What decides the <b>second</b> variable?',options:[{t:'The largest partial correlation among excluded variables (if p < p-in)',ok:true},{t:'The next-largest zero-order correlation',msg:'After step 1, what matters is what a variable adds beyond the variables already in.'},{t:'The largest raw coefficient',msg:'Raw coefficients depend on units.'}]},
   {id:'d',type:'mcq',prompt:'Stepwise left Gini out of the final model. So Gini is uncorrelated with income?',options:[{t:'No. It just adds too little beyond the included variables',ok:true},{t:'Yes, excluded means no relationship',msg:'Gini’s zero-order r with income is −0.338. It was excluded for adding little, not for having no relationship.'}]},
   {id:'e',type:'mcq',prompt:'Which method can drop a variable it added earlier?',options:[{t:'Stepwise',ok:true},{t:'Forward',msg:'Forward never removes.'},{t:'Backward',msg:'Backward only removes and never re-adds.'}]}

/* ---------- G1 ---------- */
{id:'G1',part:'G',title:'Turning a prediction into a decision',viz:'fivept',
 rule:'m = Ŷ, s = prediction SE. Five points m ± 0.5s, m ± 1.3s, m, each with p = 0.2. EV = average payoff. Value of perfect info = E[best payoff per point] − best EV.',
 idea:`<p>Case questions (Colonial Broadcasting, Mysore Silk’s ₹40,000 offer) end with a <b>decision</b>. The regression gives a prediction m = Ŷ and an uncertainty s, the SE for a single outcome. Then:</p>
 <ol style="max-width:68ch"><li>Approximate the outcome’s distribution with <b>five equally likely points</b>: m − 1.3s, m − 0.5s, m, m + 0.5s, m + 1.3s, each with probability 0.2.</li>
 <li>Work out the <b>payoff</b> of each option at each point (watch caps, thresholds and rebates).</li>
 <li><b>Expected value</b> = the average of the five payoffs. Compare it with the alternative.</li>
 <li><b>Value of perfect information:</b> if you knew the outcome, you’d pick the best option at each point. Its expected value minus the best EV without the information is the most you’d pay for a perfect forecast.</li></ol>
 <p>Because of thresholds, the payoff isn’t linear, so the payoff at m is <i>not</i> the expected payoff. Always average over the points.</p>`,
 where:{exhibits:[{title:'Colonial Broadcasting: the Harsanyi Electric offer',cols:['Term','Value'],rows:[['Payment if rating ≥ 19','$7,500,000'],['Rebate per rating point below 19','$1,000,000 (pro-rated)'],['Risk-free alternative','$5,000,000']]}],note:`<p>Drag m below and watch when the offer becomes worth taking.</p>`},
 worked:{prompt:`<p><b>Colonial Q11.</b> A fact-based movie with no star, Monday in March: the regression predicts m = 14.8814 with s = 1.905. Harsanyi or the fixed $5M?</p>`,
  steps:[
   {h:'Five rating points',b:'',calc:CB.p.map(v=>v.toFixed(4)).join('   ')},
   {h:'Harsanyi payment at each',b:'All are below 19, so the payment is 7.5M − (19 − rating) × 1M.',calc:CB.f.map(v=>'$'+Math.round(v).toLocaleString('en-US')).join('   '),xl:['=7500000-(19-(14.8814-1.3*1.905))*1000000']},
   {h:'Expected value',b:'',calc:`EV = $${Math.round(CB.ev).toLocaleString('en-US')}  <  $5,000,000`,write:'Take the fixed $5,000,000. The Harsanyi offer’s expected payment is only about $3.38M.'},
   {h:'Q12: value of perfect information',b:'With a perfect forecast you’d take Harsanyi only when it beats $5M (the top point, $5.86M).',calc:`E[best per point] = (4 × 5,000,000 + ${Math.round(CB.f[4]).toLocaleString('en-US')})/5 = ${Math.round(CB.vpi+5e6).toLocaleString('en-US')}   →   VPI = $${Math.round(CB.vpi).toLocaleString('en-US')}`}
  ]},
 guided:{intro:`<p>A Sunday slot after a strong lead-in raises the prediction to <b>m = 17.6</b> (s = 1.905). Same offer. Watch the top point: it crosses 19, where the payment is capped.</p>`,
  items:[
   {id:'a',type:'num',prompt:'Highest of the five rating points (m + 1.3s)',ans:17.6+1.3*1.905},
   {id:'b',type:'num',prompt:'Harsanyi’s payment at that point',ans:G16.f[4],mistakes:[{v:7.5e6-(19-(17.6+1.3*1.905))*1e6,msg:'Above 19 there’s no bonus: the payment is capped at $7,500,000.'}],hints:['Is the rating at least 19?']},
   {id:'c',type:'num',prompt:'Expected Harsanyi payment',ans:G16.ev,mistakes:[{v:fee(17.6),msg:'That’s the payment at m. With a threshold the average of the five payoffs can differ, so compute all five.'}],hints:['Average the five payments.']},
   {id:'d',type:'mcq',prompt:'Decision',options:[{t:'Take Harsanyi',ok:true},{t:'Take the fixed $5,000,000',msg:`EV ≈ $${Math.round(G16.ev).toLocaleString('en-US')} > $5M.`}]},
   {id:'e',type:'num',prompt:'Value of perfect information',ans:G16.vpi,hints:['At each point take max(Harsanyi, 5M), average them, then subtract 5,000,000.']}
  ]}}
);

const lessonById=id=>LESSONS.find(l=>l.id===id);
function unlocked(id){if(S.unlockAll)return true;const i=ORDER.indexOf(id);if(i>=0)return i===0||!!S.done[ORDER[i-1]];const T=TESTS.find(t=>t.id===id);return (T&&T.pre?T.pre:ORDER).every(x=>S.done[x])}

  const item=(id,title,view)=>{const lock=!unlocked(id),cur=(S.view===view&&S.id===id);const mk=view==='lesson'?(S.done[id]?'✓':''):(S.tests[id]?`${S.tests[id].pct}%`:'');
    return `<button class="navitem${cur?' cur':''}" data-go="${view}:${id}" ${lock?'disabled title="Finish the earlier lessons to unlock"':''}><span class="code">${id}</span><span class="ttl">${title}</span><span class="mk">${lock?'locked':mk}</span></button>`};
  const g=(h,arr)=>`<div class="navgroup"><h4>${h}</h4>${arr.join('')}</div>`;
  document.getElementById('nav').innerHTML=`<div class="brand">Output Court<span>DS2 regression, Sessions 1–9. Learn it, then prove it on past papers.</span></div>
  <div class="navgroups">${Object.entries(PARTS).map(([p,[t]])=>g(`Part ${p} · ${t}`,LESSONS.filter(l=>l.part===p).map(l=>item(l.id,l.title,'lesson')))).join('')}
  ${g('Past-paper tests',TESTS.filter(t=>!t.timed).map(t=>item(t.id,t.title,'test')))}
  ${g('Midterm',TESTS.filter(t=>t.timed).map(t=>item(t.id,t.title,'test')))}
  <div class="navgroup"><h4>Review</h4><button class="navitem${S.view==='progress'?' cur':''}" data-go="progress:"><span class="code">≡</span><span class="ttl">Progress and formula sheet</span></button></div></div>
  <div class="navfoot"><label><input type="checkbox" id="unlockAll" ${S.unlockAll?'checked':''}> Preview mode: unlock everything</label></div>`;
}

/* ================= Item rendering + checking ================= */
function akey(ctx,it){return ctx+'/'+it.id}
function itemHTML(ctx,it,opts={}){
  const a=S.ans[akey(ctx,it)]||{},graded=opts.graded,showLetter=opts.letter&&/^[a-z]$/.test(it.id);
  let cls='item';if(a.status==='ok'||a.status==='shown')cls+=' ok';else if(a.status==='bad')cls+=' bad';
  if(graded)cls=a.status==='ok'?'item ok':'item bad';
  let h=`<div class="${cls}" data-item="${it.id}"><div class="prompt">${showLetter?`<span class="tag">${it.id}</span>`:''}${it.prompt}</div>${it.fig?`<canvas class="rplot" data-fig="${it.fig}"></canvas>`:''}`;
  const lockIn=(a.status==='ok'||a.status==='shown'||graded);
  if(it.type==='num'){
    const v=a.raw||'';let pv='';try{const x=evalExpr(v);if(x!=null&&v.trim()&&!/^[-+]?[\d.,]+%?$/.test(v.trim()))pv='= '+nf(x)}catch(e){pv=v?String(e):''}
    h+=`<div class="inrow"><input id="in-${ctx.replace(/\W/g,'_')}-${it.id}" data-in="${it.id}" value="${esc(v)}" inputmode="decimal" autocomplete="off" spellcheck="false" ${lockIn?'readonly':''} aria-label="Answer"><span class="preview" data-pv="${it.id}">${pv}</span></div>`;
  }else{
    h+=`<div class="opts" role="radiogroup">`;it.options.forEach((o,i)=>{let oc='opt';if(a.sel===i)oc+=' sel';if((a.status==='ok'||a.status==='shown'||graded)&&o.ok)oc+=' right';else if(a.sel===i&&(a.status==='bad'||graded&&!o.ok))oc+=' wrong';
      h+=`<label class="${oc}"><input type="radio" name="r-${ctx.replace(/\W/g,'_')}-${it.id}" data-opt="${it.id}" value="${i}" ${a.sel===i?'checked':''} ${lockIn?'disabled':''}><span>${o.t}</span></label>`});h+=`</div>`;
  }
  if(!graded){
    if(a.status==='ok')h+=`<div class="fb ok"><b>Correct.</b>${it.type==='num'?` ${nf(evalSafe(a.raw))}`:''}</div>`;
    else if(a.status==='shown')h+=`<div class="fb ok"><b>Answer:</b> ${it.type==='num'?nf(it.ans):it.options.find(o=>o.ok).t}<span class="why">Work through it once more before moving on. Try reproducing it with the hints above.</span></div>`;
    else if(a.status==='bad')h+=`<div class="fb bad"><b>Not yet.</b><span class="why">${a.msg}</span></div>`;
    (a.hints||0)&&(it.hints||[]).slice(0,a.hints).forEach((t,i)=>{h+=`<div class="hint"><b>Hint ${i+1}.</b> ${t}</div>`});
    if(a.status==='ok'&&it.curve)h+=`<canvas class="tcurve" data-curve='${JSON.stringify(it.curve)}'></canvas>`;
    if(a.status!=='ok'&&a.status!=='shown'){h+=`<div class="itemfoot">${(it.hints||[]).length>(a.hints||0)?`<button class="btn ghost" data-hint="${it.id}">Show a hint</button>`:''}${(a.tries||0)>=2?`<button class="btn ghost" data-reveal="${it.id}">Show the answer</button>`:''}</div>`}
  }else{
    const exp=it.type==='num'?nf(it.ans):it.options.find(o=>o.ok).t;
    h+=a.status==='ok'?`<div class="fb ok"><b>Correct.</b></div>`:`<div class="fb bad"><b>Expected:</b> ${exp}${a.msg?`<span class="why">${a.msg}</span>`:''}</div>`;
  }
  return h+`</div>`;
}
function exhibitHTML(list){return `<div class="xwrap"><div class="xout xex">${list.map(ex=>`<div class="xsec">${ex.title}</div>${ex.note?`<div class="toolnote" style="font-family:var(--body);margin-bottom:4px">${ex.note}</div>`:''}<table class="xt"><tr>${ex.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${ex.rows.map(r=>`<tr>${r.map(c=>`<td>${c===''||c==null?'<span class="cell hide">—</span>':c}</td>`).join('')}</tr>`).join('')}</table>`).join('')}</div></div>`}
function xlHTML(arr){return `<div class="xlbox">${arr.map(f=>`<div class="xlrow"><span class="xltag">Excel</span><code>${esc(f)}</code><button class="btn ghost" data-tocalc="${esc(f)}">Open in calculator</button></div>`).join('')}</div>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function evalSafe(v){try{return evalExpr(v)}catch(e){return NaN}}
function near(x,target,it,m){const tol=(m&&m.tol)||it.tol||0.008;const abs=(m&&m.abs!=null)?m.abs:(it.abs!=null?it.abs:null);
  if(abs!=null)return Math.abs(x-target)<=abs;return Math.abs(x-target)<=Math.max(Math.abs(target)*tol,1e-9)}
function checkItem(it,a){
  if(it.type==='mcq'){if(a.sel==null)return{ok:false,msg:'Pick one option.'};const o=it.options[a.sel];return o.ok?{ok:true}:{ok:false,msg:o.msg||'That option doesn\'t match the claim.'}}
  if(!a.raw||!a.raw.trim())return{ok:false,msg:'Enter a value.'};
  let x;try{x=evalExpr(a.raw)}catch(e){return{ok:false,msg:'Couldn\'t read that: '+e+'.'}}
  if(x==null||!isFinite(x))return{ok:false,msg:'That doesn\'t give a number.'};
  if(it.pct&&/%\s*$/.test(a.raw.trim())===false&&Math.abs(x)>1&&near(x/100,it.ans,it))return{ok:true};
  if(near(x,it.ans,it))return{ok:true};
  if((it.alts||[]).some(a=>near(x,a,it)))return{ok:true};
  for(const m of it.mistakes||[])if(near(x,m.v,it,m))return{ok:false,msg:m.msg};
  if(Math.abs(it.ans)>1e-9&&near(-x,it.ans,it))return{ok:false,msg:'Right size, wrong sign. Check the direction.'};
  const r=x/it.ans;if(isFinite(r)&&[10,100,1000,0.1,0.01,0.001].some(f=>Math.abs(r-f)/f<0.01))return{ok:false,msg:'The digits look right, but it\'s off by a power of 10. Check the units or a decimal place.'};
  if(it.ans!==0&&Math.abs(x-it.ans)/Math.abs(it.ans)<0.05)return{ok:false,msg:'Very close. Check your rounding. Carry more decimals through the intermediate steps.'};
  return{ok:false,msg:(it.hints&&it.hints.length)?'Not quite. Try a hint.':'Not quite. Check your working.'};
}

/* ================= Lesson view ================= */
const STEPS=['The idea','Where it lives','Worked example','Your turn'];
function lessonHTML(L){
  const i=ORDER.indexOf(L.id),st=S.step;
  let h=`<div class="eyebrow">Part ${L.part} · ${PARTS[L.part][0]} · ${L.session} · Lesson ${i+1} of ${ORDER.length}</div><h1>${L.title}</h1>
  <div class="stepper" role="tablist">${STEPS.map((s,k)=>`<button role="tab" data-step="${k}" class="${k===st?'cur':''}${k<st?' done':''}" aria-selected="${k===st}">${k+1} · ${s}</button>`).join('')}</div>`;
  if(st===0){h+=`<div class="stack"><div class="panel">${L.idea}</div><div class="rule"><b>Key rule</b>${L.rule}</div></div>`}
  if(st===1){
    h+=`<div class="stack">`;
    if(L.whereHtml)h+=`<div class="panel">${L.whereHtml}</div>`;
    else if(L.where){const W=L.where,M=W.model&&MODELS[W.model];h+=`${W.formula?`<div class="formula">${W.formula}</div>`:''}${M?outputTable(M,W.cells,{desc:W.desc}):''}${W.exhibits?exhibitHTML(W.exhibits):''}<div>${W.note||''}</div>${M?`<p class="toolnote">Yellow cells are what this lesson computes. Outlined cells are what it's built from, colour-matched to the formula.</p>`:''}`}
    if(L.viz)h+=`<div class="panel"><div class="eyebrow" style="margin-bottom:8px">Try it</div><div data-viz="${L.viz}"></div></div>`;
    h+=`</div>`;
  }
  if(st===2){const Wk=L.worked,n=S.wrev[L.id]||0,shown={};Wk.steps.slice(0,n).forEach(s=>(s.show||[]).forEach(id=>shown[id]='fill'));
    const cells={...(Wk.cells||{}),...shown};
    h+=`<div class="stack"><div class="panel">${Wk.prompt}</div>${Wk.model?outputTable(MODELS[Wk.model],cells,{desc:L.id==='B2'||Wk.desc}):''}${Wk.exhibits?exhibitHTML(Wk.exhibits):''}<div class="wsteps">`;
    Wk.steps.slice(0,n).forEach((s,k)=>{h+=`<div class="wstep${k===n-1?' new':''}"><div class="wnum">${k+1}</div><div><h3>${s.h}</h3>${s.b?`<div>${s.b}</div>`:''}${s.calc?`<div class="calc">${s.calc}</div>`:''}${s.xl?xlHTML(s.xl):''}${s.write?`<div class="write">${s.write}</div>`:''}${s.fig?`<canvas class="rplot" data-fig="${s.fig}"></canvas>`:''}${s.curve?`<canvas class="tcurve" data-curve='${JSON.stringify(s.curve)}'></canvas>`:''}</div></div>`});
    h+=`</div>${n<Wk.steps.length?`<div><button class="btn primary" data-wnext>${n===0?'Start the worked example':'Show the next step'}</button> <span class="toolnote">Step ${n} of ${Wk.steps.length}</span></div>`:`<div class="toolnote">That's the full solution. Now try one yourself.</div>`}</div>`;
  }
  if(st===3){const G=L.guided,ctx='L'+L.id;const cells={...(G.cells||{})};
    G.items.forEach(it=>{const a=S.ans[akey(ctx,it)];if(it.fill&&a&&(a.status==='ok'||a.status==='shown'))cells[it.fill]='fill'});
    h+=`<div class="stack"><div class="panel">${G.intro}<p class="toolnote" style="margin:0">Answers can be numbers or expressions, including Excel functions such as <code>SQRT(4.7449)</code>, <code>T.INV.2T(0.05, 8)</code> or <code>F.INV.RT(0.05, 1, 34)</code>. Or work it out in the <b>Calculator</b> (bottom right) and press <b>Use in answer</b>.</p></div>
    ${G.model?outputTable(MODELS[G.model],cells,{desc:L.id==='A2'||L.id==='B3'||G.desc}):''}${G.exhibits?exhibitHTML(G.exhibits):''}
    ${G.items.map(it=>itemHTML(ctx,it,{letter:!!G.model})).join('')}`;
    const allOk=G.items.every(it=>{const a=S.ans[akey(ctx,it)];return a&&(a.status==='ok'||a.status==='shown')});
    if(allOk){const nxt=ORDER[ORDER.indexOf(L.id)+1];h+=`<div class="banner"><h2>${L.id} unlocked for the tests</h2><p><b>Key rule:</b> ${L.rule}</p><button class="btn primary" data-go="${nxt?'lesson:'+nxt:'test:T1'}">${nxt?`Next lesson: ${lessonById(nxt).title}`:'Take Test 1: JP Nagar'}</button></div>`}
    else h+=`<div><button class="btn primary" data-check>Check answers</button></div>`;
    h+=`</div>`;
  }
  h+=`<div class="navrow"><button class="btn" data-step="${Math.max(0,st-1)}" ${st===0?'disabled style="visibility:hidden"':''}>Back</button>${st<3?`<button class="btn primary" data-step="${st+1}">Next: ${STEPS[st+1]}</button>`:''}</div>`;
  return h;
}

/* ================= Test view ================= */
function testHTML(T){
  const M=T.model?MODELS[T.model]:null,ctx='T'+T.id,sub=S.submitted[T.id];
  let h=`<div class="eyebrow">${T.timed?'Timed mock':'Past-paper test'} · ${T.source}</div><h1>${T.title}</h1>
  <div class="stack"><div class="panel case">${T.caseHtml}<p class="toolnote" style="margin:0">No hints here. Expressions and Excel functions work in every box. Submit when you're done to see your marks and the full working.${T.pre?` Covers: ${T.pre.join(', ')}.`:''}</p></div>`;
  if(T.timed&&!sub&&!S.timer[T.id]){h+=`<div class="panel"><h2>${T.timed} minutes, ${T.qs.length} questions</h2><p>The clock starts when you press Start and the test submits itself when time runs out. Treat it like the real midterm: calculator allowed, no lessons open.</p><button class="btn primary" data-starttimer="${T.id}">Start the ${T.timed}-minute mock</button></div></div>`;return h}
  if(T.timed&&!sub)h+=`<div class="timerbar" id="timerbar">Time left <b id="timeleft">--:--</b><button class="btn ghost" data-submit="${T.id}">Submit now</button></div>`;
  if(M)h+=outputTable(M,T.cells,{desc:true});
  if(T.exhibits)h+=exhibitHTML(T.exhibits);
  if(sub){const r=S.tests[T.id];h+=`<div class="panel" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="score">${r.got.toFixed(1)} / ${r.max}</div><div><b>${r.pct}%</b><br><span class="toolnote">Weak spots are flagged below with a link back to the lesson.</span></div><button class="btn" data-retake="${T.id}" style="margin-left:auto">Try again</button></div>`}
  T.qs.forEach(q=>{
    h+=`<div class="qblock"><div class="qhead"><h2>Q${q.n}</h2><span class="toolnote">${q.tags.join(' · ')}</span><span class="pts">${q.pts} pt${q.pts>1?'s':''}</span></div>${q.ex?exhibitHTML(q.ex):''}<p>${q.prompt}</p>`;
    h+=q.items.map(it=>itemHTML(ctx+'/'+q.n,it,{graded:!!sub})).join('');
    if(sub){const qr=S.tests[T.id].q[q.n];h+=`<div class="panel"><b>${qr.got.toFixed(1)} / ${q.pts}.</b> ${q.explain}${q.xl?xlHTML(q.xl):''}${qr.got<q.pts?`<div style="margin-top:10px">${q.tags.map(t=>`<button class="btn" data-go="lesson:${t}">Review ${t}: ${lessonById(t).title}</button>`).join(' ')}</div>`:''}</div>`}
    h+=`</div>`;});
  if(!sub)h+=`<div><button class="btn primary" data-submit="${T.id}">Submit test</button></div>`;
  return h+`</div>`;
}
function gradeTest(T){
  const ctx='T'+T.id;let got=0,max=0;const q={},tag={};
  T.qs.forEach(Q=>{let ok=0;Q.items.forEach(it=>{const k=akey(ctx+'/'+Q.n,it),a=S.ans[k]||(S.ans[k]={});const r=checkItem(it,a);a.status=r.ok?'ok':'bad';a.msg=r.ok?'':(it.type==='mcq'?'':r.msg&&!/hint/.test(r.msg)?r.msg:'');if(r.ok)ok++});
    const g=Q.pts*ok/Q.items.length;got+=g;max+=Q.pts;q[Q.n]={got:g};Q.tags.forEach(t=>{tag[t]=tag[t]||{got:0,max:0};tag[t].got+=g;tag[t].max+=Q.pts})});
  S.tests[T.id]={got,max,pct:Math.round(100*got/max),q,tag};S.submitted[T.id]=true;delete S.timer[T.id];save();
}

/* ================= Progress view ================= */
function progressHTML(){
  const tagAgg={};Object.values(S.tests).forEach(r=>Object.entries(r.tag||{}).forEach(([t,v])=>{tagAgg[t]=tagAgg[t]||{got:0,max:0};tagAgg[t].got+=v.got;tagAgg[t].max+=v.max}));
  const lessonsDone=ORDER.filter(x=>S.done[x]).length,acc=LESSONS.map(L=>{const a=tagAgg[L.id];return a?a.got/a.max:0}),ready=Math.round(100*(0.3*lessonsDone/ORDER.length+0.7*acc.reduce((p,c)=>p+c,0)/acc.length));
  const mock=TESTS.find(t=>t.timed),mr=mock&&S.tests[mock.id];
  let h=`<div class="eyebrow">Review</div><h1>Progress and formula sheet</h1><div class="stack">
  <div class="grid3"><div class="panel"><div class="eyebrow">Midterm readiness</div><div class="score">${ready}%</div><p class="toolnote" style="margin:6px 0 0">30% lessons finished, 70% accuracy on past-paper questions for each concept. Untested concepts count as 0.</p></div>
  <div class="panel"><div class="eyebrow">Lessons finished</div><div class="score">${lessonsDone}<span style="font-size:22px;color:var(--muted)"> / ${ORDER.length}</span></div></div>
  <div class="panel"><div class="eyebrow">Timed mock</div><div class="score">${mr?mr.pct+'%':'—'}</div><p class="toolnote" style="margin:6px 0 0">${mr?'Retake it after reviewing the flagged lessons.':'Unlocks when every lesson is done.'}</p></div></div>
  <div class="panel tblwrap"><table class="plain"><tr><th>Concept</th><th>Session</th><th>Lesson</th><th>Past-paper accuracy</th><th></th></tr>`;
  LESSONS.forEach(L=>{const a=tagAgg[L.id],pct=a?Math.round(100*a.got/a.max):null;
    h+=`<tr><td><b>${L.id}</b> ${L.title}</td><td class="toolnote">${L.session}</td><td>${S.done[L.id]?'<span style="color:var(--ok)">Passed</span>':'Not yet'}</td><td>${pct==null?'<span class="toolnote">No test yet</span>':`<div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${pct}%"></i></div><span class="m">${pct}%</span></div>`}</td><td>${pct!=null&&pct<70?`<button class="btn ghost" data-go="lesson:${L.id}">Review</button>`:''}</td></tr>`});
  h+=`</table></div><h2>Your formula sheet</h2><p class="toolnote">The key rule from every lesson you've passed.</p><div class="grid2">`;
  const passed=LESSONS.filter(L=>S.done[L.id]);
  h+=passed.length?passed.map(L=>`<div class="rule"><b>${L.id} · ${L.title}</b>${L.rule}</div>`).join(''):'<p>Pass a lesson to add its rule here.</p>';
  h+=`</div><div class="panel"><h3>Start over</h3><p>Clears every lesson, answer and test score saved in this browser.</p><div id="resetBox"><button class="btn" data-reset1>Reset progress</button></div></div></div>`;
  return h;
}

/* ================= Render + events ================= */
const main=document.getElementById('main');
function render(focusTop){
  renderNav();
  if(S.view==='lesson'){if(!unlocked(S.id))S.id=ORDER.find(x=>!S.done[x])||'A1';main.innerHTML=lessonHTML(lessonById(S.id))}
  else if(S.view==='test'){const T=TESTS.find(t=>t.id===S.id);if(!T||!unlocked(T.id)){S.view='lesson';S.id='A1';return render()}main.innerHTML=testHTML(T)}
  else main.innerHTML=progressHTML();
  main.querySelectorAll('canvas[data-curve]').forEach(cv=>drawT(cv,JSON.parse(cv.dataset.curve)));
  main.querySelectorAll('canvas[data-fig]').forEach(cv=>drawFig(cv,cv.dataset.fig));
  main.querySelectorAll('[data-viz]').forEach(el=>{const f=VIZ[el.dataset.viz];if(f)f(el)});
  tickTimer();
  if(focusTop){window.scrollTo({top:0});main.focus({preventScroll:true})}
  save();
}
function ctxOf(el){if(S.view==='lesson')return 'L'+S.id;const qb=el.closest('.qblock');const n=qb.querySelector('h2').textContent.slice(1);return 'T'+S.id+'/'+n}
function itemOf(el,id){if(S.view==='lesson')return lessonById(S.id).guided.items.find(i=>i.id===id);const T=TESTS.find(t=>t.id===S.id);const n=el.closest('.qblock').querySelector('h2').textContent.slice(1);return T.qs.find(q=>q.n===n).items.find(i=>i.id===id)}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go&&!go.disabled){const[v,id]=go.dataset.go.split(':');S.view=v;if(id)S.id=id;if(v==='lesson')S.step=0;render(true);return}
  const stp=e.target.closest('[data-step]');if(stp){S.step=+stp.dataset.step;render(true);return}
  if(e.target.closest('[data-wnext]')){S.wrev[S.id]=(S.wrev[S.id]||0)+1;render();const last=main.querySelector('.wstep.new');last&&last.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  const hb=e.target.closest('[data-hint]');if(hb){const it=itemOf(hb,hb.dataset.hint),k=akey(ctxOf(hb),it),a=S.ans[k]||(S.ans[k]={});a.hints=(a.hints||0)+1;render();return}
  const rv=e.target.closest('[data-reveal]');if(rv){const it=itemOf(rv,rv.dataset.reveal),k=akey(ctxOf(rv),it),a=S.ans[k]||(S.ans[k]={});a.status='shown';if(it.type==='num')a.raw=String(+it.ans.toPrecision(8));else a.sel=it.options.findIndex(o=>o.ok);a.hints=(it.hints||[]).length;afterCheck();render();return}
  if(e.target.closest('[data-check]')){const L=lessonById(S.id),ctx='L'+L.id;L.guided.items.forEach(it=>{const k=akey(ctx,it),a=S.ans[k]||(S.ans[k]={});if(a.status==='ok'||a.status==='shown')return;const r=checkItem(it,a);if(a.raw==null&&a.sel==null){a.status=null;return}a.status=r.ok?'ok':'bad';a.msg=r.msg;if(!r.ok)a.tries=(a.tries||0)+1});afterCheck();render();return}
  const sb=e.target.closest('[data-submit]');if(sb){gradeTest(TESTS.find(t=>t.id===sb.dataset.submit));render(true);return}
  const rt=e.target.closest('[data-retake]');if(rt){const id=rt.dataset.retake;Object.keys(S.ans).filter(k=>k.startsWith('T'+id+'/')).forEach(k=>delete S.ans[k]);delete S.submitted[id];delete S.timer[id];render(true);return}
  const stt=e.target.closest('[data-starttimer]');if(stt){const T=TESTS.find(t=>t.id===stt.dataset.starttimer);S.timer[T.id]=Date.now()+T.timed*60000;render(true);return}
  if(e.target.closest('[data-reset1]')){document.getElementById('resetBox').innerHTML=`<p><b>Reset everything?</b> This can't be undone.</p><button class="btn" data-reset2 style="border-color:var(--bad);color:var(--bad)">Yes, reset</button> <button class="btn ghost" data-cancelreset>Cancel</button>`;return}
  if(e.target.closest('[data-cancelreset]')){render();return}
  if(e.target.closest('[data-reset2]')){S.done={};S.tests={};S.ans={};S.submitted={};S.wrev={};S.id='A1';S.view='lesson';S.step=0;render(true);return}
});
function afterCheck(){if(S.view!=='lesson')return;const L=lessonById(S.id),ctx='L'+L.id;if(L.guided.items.every(it=>{const a=S.ans[akey(ctx,it)];return a&&(a.status==='ok'||a.status==='shown')}))S.done[L.id]=true}
document.addEventListener('input',e=>{
  const inp=e.target.closest('[data-in]');if(inp){const it=itemOf(inp,inp.dataset.in),k=akey(ctxOf(inp),it),a=S.ans[k]||(S.ans[k]={});a.raw=inp.value;if(a.status==='bad')a.status=null;
    const pv=main.querySelector(`[data-pv="${inp.dataset.in}"]`);if(pv&&inp.closest('.item')===pv.closest('.item')){let t='';try{const x=evalExpr(inp.value);if(x!=null&&!/^[-+]?[\d.,]+%?$/.test(inp.value.trim()))t='= '+nf(x)}catch(err){t=inp.value.trim()?String(err):''}pv.textContent=t}
    else{const own=inp.closest('.item').querySelector('[data-pv]');if(own){let t='';try{const x=evalExpr(inp.value);if(x!=null&&!/^[-+]?[\d.,]+%?$/.test(inp.value.trim()))t='= '+nf(x)}catch(err){t=inp.value.trim()?String(err):''}own.textContent=t}}
    return}
  const op=e.target.closest('[data-opt]');if(op){const it=itemOf(op,op.dataset.opt),k=akey(ctxOf(op),it),a=S.ans[k]||(S.ans[k]={});a.sel=+op.value;if(a.status==='bad')a.status=null;
    op.closest('.opts').querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.contains(op)));return}
  if(e.target.id==='unlockAll'){S.unlockAll=e.target.checked;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-in]')){e.preventDefault();const b=main.querySelector('[data-check],[data-submit]');if(S.view==='lesson'&&b)b.click()}});
window.addEventListener('resize',()=>main.querySelectorAll('canvas[data-curve]').forEach(cv=>drawT(cv,JSON.parse(cv.dataset.curve))));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>main.querySelectorAll('canvas[data-curve]').forEach(cv=>drawT(cv,JSON.parse(cv.dataset.curve))));
/* ================= Calculator ================= */
const XLF=[
 ['T.INV.2T(α, df)','T.INV.2T(','Two-tailed critical t. Use for 95% intervals and ≠ tests.','T.INV.2T(0.05, 8) = 2.306'],
 ['T.INV(p, df)','T.INV(','Left-tail quantile. Left-tailed test: T.INV(α, df). Right-tailed: T.INV(1 − α, df).','T.INV(0.95, 8) = 1.860'],
 ['T.DIST.RT(t, df)','T.DIST.RT(','Right-tail p-value for a t statistic.','T.DIST.RT(2.808, 8) = 0.0115'],
 ['T.DIST.2T(|t|, df)','T.DIST.2T(','Two-tailed p-value. Takes the absolute value of t.','T.DIST.2T(5.625, 8) = 0.0005'],
 ['T.DIST(t, df, TRUE)','T.DIST(','Left-tail probability P(T ≤ t). Left-tailed p-value.','T.DIST(-2.1, 34, TRUE) = 0.022'],
 ['F.INV.RT(α, k, n−k−1)','F.INV.RT(','Critical F for the overall or partial F-test.','F.INV.RT(0.05, 1, 8) = 5.318'],
 ['F.DIST.RT(F, k, n−k−1)','F.DIST.RT(','p-value of an F statistic (Significance F).','F.DIST.RT(31.64, 1, 8) = 0.0005'],
 ['NORM.S.INV(p)','NORM.S.INV(','Standard normal quantile (z).','NORM.S.INV(0.975) = 1.96'],
 ['NORM.S.DIST(z, TRUE)','NORM.S.DIST(','Standard normal P(Z ≤ z).','NORM.S.DIST(1.96, TRUE) = 0.975'],
 ['SQRT(x)','SQRT(','Square root, e.g. Sₑ = SQRT(MSE).','SQRT(4.7449) = 2.178'],
 ['POWER(x, y)','POWER(','x to the power y. Same as x^y.','POWER(4.5717, 2) = 20.9'],
 ['LN(x) · LOG(x) · EXP(x)','LN(','Natural log, base-10 log, eˣ. Used for log models.','LN(1.01) = 0.00995'],
 ['ABS(x)','ABS(','Absolute value, e.g. ABS(t).','ABS(-5.625) = 5.625'],
 ['ROUND(x, digits)','ROUND(','Round to a number of decimals.','ROUND(2.30600, 3) = 2.306']];
const C={hist:[],last:null,res:null,target:null};
const cin=document.getElementById('cin'),cres=document.getElementById('cres'),calc=document.getElementById('calc'),fab=document.getElementById('calcFab');
document.getElementById('xllist').innerHTML=XLF.map(f=>`<button class="xlf" type="button" data-k="${f[1]}"><code>${f[0]}</code><span>${f[2]}</span><span class="m">${f[3]}</span></button>`).join('');
function cfmt(v){if(!isFinite(v))return String(v);const a=Math.abs(v);if(a!==0&&(a<1e-6||a>=1e15))return v.toExponential(8).replace(/\.?0+e/,'e');return trimz(String(+v.toPrecision(12)))}
function cpreview(){const v=cin.value;cres.classList.remove('err');if(!v.trim()){cres.textContent=C.res==null?'0':cfmt(C.res);return}try{const x=evalExpr(v);cres.textContent=x==null?'':cfmt(x)}catch(e){cres.textContent=String(e);cres.classList.add('err')}}
function cins(t){const a=cin.selectionStart??cin.value.length,b=cin.selectionEnd??a;cin.value=cin.value.slice(0,a)+t+cin.value.slice(b);const p=a+t.length;cin.focus({preventScroll:true});cin.setSelectionRange(p,p);cpreview()}
function ceq(){const v=cin.value.trim();if(!v)return;try{const x=evalExpr(v);if(x==null||!isFinite(x))throw 'No result';ANSV=x;C.res=x;C.hist.unshift([v,x]);C.hist=C.hist.slice(0,8);document.getElementById('chist').textContent=v+' =';cin.value=cfmt(x);cpreview();renderHist()}catch(e){cres.textContent=String(e);cres.classList.add('err')}}
function renderHist(){document.getElementById('chistlist').innerHTML=C.hist.map(([e,x],i)=>`<button type="button" data-hist="${i}">${esc(e)} = <b>${cfmt(x)}</b></button>`).join('')||'<span class="toolnote">Results appear here.</span>'}
function openCalc(expr){calc.hidden=false;fab.setAttribute('aria-expanded','true');if(expr!=null){cin.value=expr;cpreview()}updUse();setTimeout(()=>cin.focus({preventScroll:true}),0)}
function closeCalc(){calc.hidden=true;fab.setAttribute('aria-expanded','false')}
function updUse(){const el=C.target&&document.getElementById(C.target);const ok=!!(el&&!el.readOnly);const b=document.getElementById('cuseBtn');b.disabled=!ok;document.getElementById('cuseNote').hidden=ok}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('[data-in]')){C.target=e.target.id;updUse()}});
fab.addEventListener('click',()=>calc.hidden?openCalc():closeCalc());
calc.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
calc.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');if(k){cins(k.dataset.k);if(k.classList.contains('xlf'))setCTab('keys');return}
  const t=e.target.closest('[data-ctab]');if(t){setCTab(t.dataset.ctab);return}
  const hb=e.target.closest('[data-hist]');if(hb){cin.value=C.hist[+hb.dataset.hist][0];cpreview();cin.focus();return}
  if(e.target.closest('[data-cclose]')){closeCalc();fab.focus();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='ac'){cin.value='';C.res=null;document.getElementById('chist').textContent='';cpreview();cin.focus()}
  else if(act==='bs'){const p=cin.selectionStart??cin.value.length;if(p>0){cin.value=cin.value.slice(0,p-1)+cin.value.slice(p);cin.setSelectionRange(p-1,p-1)}cpreview();cin.focus()}
  else if(act==='eq')ceq();
  else if(act==='use'){let x;try{x=cin.value.trim()?evalExpr(cin.value):C.res}catch(err){x=null}const el=C.target&&document.getElementById(C.target);if(el&&x!=null&&isFinite(x)&&!el.readOnly){el.value=String(+x.toPrecision(10));el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();el.classList.add('pulse')}}
  else if(act==='copy'){let x;try{x=cin.value.trim()?evalExpr(cin.value):C.res}catch(err){}if(x!=null){const t=String(+x.toPrecision(10));const done=()=>{a.textContent='Copied';setTimeout(()=>a.textContent='Copy result',1200)};try{navigator.clipboard.writeText(t).then(done,()=>{cin.value=t;cin.select()})}catch(err){cin.value=t;cin.select()}}}
});
function setCTab(t){document.querySelectorAll('[data-ctab]').forEach(b=>b.classList.toggle('cur',b.dataset.ctab===t));document.getElementById('cpKeys').hidden=t!=='keys';document.getElementById('cpExcel').hidden=t!=='excel'}
cin.addEventListener('input',cpreview);
cin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ceq()}if(e.key==='Escape'){closeCalc();fab.focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-tocalc]');if(b){openCalc(b.dataset.tocalc.replace(/^=/,''));setCTab('keys')}});

function tickTimer(){const el=document.getElementById('timeleft');if(!el||S.view!=='test')return;const end=S.timer[S.id];if(!end)return;const ms=end-Date.now();if(ms<=0){gradeTest(TESTS.find(t=>t.id===S.id));render(true);return}const m=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;el.textContent=`${m}:${String(sec).padStart(2,'0')}`;el.parentElement.classList.toggle('low',ms<5*60000)}
setInterval(tickTimer,1000);
if(!['lesson','test','progress'].includes(S.view))S.view='lesson';
S.step=0;render();
</script>
